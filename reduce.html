<body>
    <script>
        const num=[11,2,3,45,5,39,87,99,88];
        const even=num.filter((i)=>(i%2==0));
        const square=even.map((i)=>(i*i));
        const sum=square.reduce((i,s)=>(i+s));
        console.log("sum==",sum);
    </script>
