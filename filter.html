<body>
    <script>
        const num=[11,22,3,2,4,5,60,88,75];
        const even=num.filter((i)=>(i%2==0));
        const odd=num.filter((i)=>(i%2!=0));
        console.log("num==",num);
        console.log("even==",even);
        console.log("odd==",odd);
    </script>
</body>
